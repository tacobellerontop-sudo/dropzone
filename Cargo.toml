[workspace]
resolver = "3"
members = ["crates/dropzone-core", "crates/dropzone-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Image and archive codecs are painfully slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 2
