name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg (for the media tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p dropzone
      - run: cargo test --workspace --release

      - name: Download FFmpeg
        shell: pwsh
        run: |
          # Gyan's "essentials" build: x264, VP9, Opus, MP3, AV1 decode. GPLv3.
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" dist\
          Copy-Item "$($root.FullName)\LICENSE" dist\FFMPEG-LICENSE.txt
          & dist\ffmpeg.exe -hide_banner -version | Select-Object -First 1 | Tee-Object dist\FFMPEG-VERSION.txt

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target\release\dropzone.exe dist\Dropzone.exe
          Copy-Item README.md, LICENSE dist\
          Compress-Archive dist\* Dropzone-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Dropzone-windows-x64
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME Dropzone-windows-x64.zip --clobber
