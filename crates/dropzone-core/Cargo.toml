[package]
name = "dropzone-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File conversion, renaming, PDF and archive engine behind the Dropzone app"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6"
chrono = "0.4.45"
crc32fast = "1.5.2"
flate2 = "1.1.10"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "avif", "rayon"] }
lopdf = "0.45.0"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "optimization"] }
md-5 = "0.11.0"
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
walkdir = "2.5.0"
webp = { version = "0.3.1", default-features = false }
zip = "9.0.5"
