[package]
name = "dropzone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A lightweight file explorer with built-in converters, batch rename and archive tools"

[dependencies]
dropzone-core = { path = "../dropzone-core" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland", "persistence"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
trash = "5.2.9"
dirs = "7.0.0"
chrono = "0.4.45"
serde_json = "1.0.154"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
